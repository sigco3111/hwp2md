---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install hwp2md (with all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run pytest
        run: pytest

  lint-yaml:
    name: yamllint (workflows + action.yml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint
        run: |
          yamllint action.yml
          yamllint .github/workflows/

  action-yaml:
    name: Validate action.yml schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          python -c "
          import yaml
          with open('action.yml') as f:
              cfg = yaml.safe_load(f)
          run = cfg.get('runs', {})
          assert run.get('using') in {
              'composite', 'docker', 'node20', 'node16'
          }, 'unsupported runner'
          for k in ('name', 'description', 'inputs', 'runs'):
              assert k in cfg, f'missing key: {k}'
          print('action.yml schema: OK')
          "
